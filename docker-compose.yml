# NovaBank local environment: Db2 + 3 services + gateway + UI, one command.
#   ./dev.sh up        (or: docker compose up -d --build)
# Expects the six repos side by side:
#   novabank/
#     novabank-platform/   <- you are here
#     novabank-auth-service/  novabank-account-service/  novabank-transaction-service/
#     novabank-api-gateway/   novabank-ui/
name: novabank

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: local
  DB_HOST: db2
  DB_PORT: "50000"
  DB_NAME: NOVABANK
  DB_USER: db2inst1
  DB_PASSWORD: ${DB_PASSWORD:-NovaBank2026}
  JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-internal-key}
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -Duser.timezone=UTC"

services:
  db2:
    build:
      context: ./db2
      args:
        DB2_IMAGE: ${DB2_IMAGE:-icr.io/db2_community/db2:11.5.9.0}
    image: novabank-db2:local
    container_name: novabank-db2
    platform: linux/amd64
    privileged: true              # required by Db2 Community Edition
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB_PASSWORD:-NovaBank2026}
      DBNAME: NOVABANK
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
      TO_CREATE_SAMPLEDB: "false"
      REPODB: "false"
      IS_OSXFS: "false"
      PERSISTENT_HOME: "true"
      HADR_ENABLED: "false"
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "true"
    ports:
      - "50000:50000"
    volumes:
      - db2data:/database
    healthcheck:
      test: ["CMD-SHELL", "test -f /database/config/.novabank_seeded && su - db2inst1 -c 'db2 connect to NOVABANK' > /dev/null"]
      interval: 15s
      timeout: 20s
      retries: 60
      start_period: 120s

  account-service:
    build: ../novabank-account-service
    image: novabank-account-service:local
    environment:
      <<: *service-env
      PORT: "8082"
    ports: ["8082:8082"]
    depends_on:
      db2: { condition: service_healthy }
    healthcheck: &java-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  auth-service:
    build: ../novabank-auth-service
    image: novabank-auth-service:local
    environment:
      <<: *service-env
      PORT: "8081"
      ACCOUNT_SERVICE_URL: http://account-service:8082
    ports: ["8081:8081"]
    depends_on:
      db2: { condition: service_healthy }
    healthcheck: *java-health

  transaction-service:
    build: ../novabank-transaction-service
    image: novabank-transaction-service:local
    environment:
      <<: *service-env
      PORT: "8083"
      ACCOUNT_SERVICE_URL: http://account-service:8082
    ports: ["8083:8083"]
    depends_on:
      db2: { condition: service_healthy }
    healthcheck: *java-health

  api-gateway:
    build: ../novabank-api-gateway
    image: novabank-api-gateway:local
    environment:
      SPRING_PROFILES_ACTIVE: local
      PORT: "8080"
      AUTH_SERVICE_URL: http://auth-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports: ["8080:8080"]
    depends_on:
      auth-service: { condition: service_healthy }
      account-service: { condition: service_healthy }
      transaction-service: { condition: service_healthy }
    healthcheck: *java-health

  ui:
    build: ../novabank-ui
    image: novabank-ui:local
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
    ports: ["4200:8080"]
    depends_on:
      api-gateway: { condition: service_healthy }

volumes:
  db2data:
