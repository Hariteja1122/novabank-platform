$kind: http-request
url: "{{baseUrl}}/api/transactions?account={{fromAccount}}"
method: GET
queryParams:
  account: "{{fromAccount}}"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
