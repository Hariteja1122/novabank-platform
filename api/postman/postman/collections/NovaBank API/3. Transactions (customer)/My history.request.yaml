$kind: http-request
url: "{{baseUrl}}/api/transactions?page=0&size=20"
method: GET
queryParams:
  page: "0"
  size: "20"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
