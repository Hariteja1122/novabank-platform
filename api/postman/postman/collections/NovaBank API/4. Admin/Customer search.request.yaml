$kind: http-request
url: "{{baseUrl}}/api/admin/users?role=CUSTOMER&q="
method: GET
queryParams:
  role: CUSTOMER
  q: ""
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
