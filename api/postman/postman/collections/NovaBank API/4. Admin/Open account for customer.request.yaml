$kind: http-request
url: "{{baseUrl}}/api/admin/accounts"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customerId": 5,
      "customerName": "Michael Chen",
      "accountType": "SAVINGS",
      "initialDeposit": 500.0
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 8000
