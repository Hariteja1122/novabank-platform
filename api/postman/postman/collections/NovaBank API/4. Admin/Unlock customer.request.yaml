$kind: http-request
url: "{{baseUrl}}/api/admin/users/5/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "ACTIVE"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
