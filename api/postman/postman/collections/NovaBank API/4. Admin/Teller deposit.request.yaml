$kind: http-request
url: "{{baseUrl}}/api/admin/transactions/deposit"
method: POST
headers:
  Idempotency-Key: "{{$guid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "toAccount": "100245180031",
      "amount": 1500.0,
      "description": "Branch cash deposit"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 13000
