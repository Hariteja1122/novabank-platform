$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "wrong"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("status is 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000
