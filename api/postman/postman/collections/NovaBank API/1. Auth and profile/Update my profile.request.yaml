$kind: http-request
url: "{{baseUrl}}/api/auth/me"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "John Carter",
      "phone": "+1 248 555 0142"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 7000
