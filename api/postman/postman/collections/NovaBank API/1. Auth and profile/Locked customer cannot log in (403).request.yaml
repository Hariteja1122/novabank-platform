$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "david.okafor@example.com",
      "password": "Password@123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("status is 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
