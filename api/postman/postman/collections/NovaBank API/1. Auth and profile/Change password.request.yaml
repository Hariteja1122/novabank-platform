$kind: http-request
url: "{{baseUrl}}/api/auth/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "Password@123",
      "newPassword": "Password@123"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 204", () => pm.response.to.have.status(204));
    language: text/javascript
order: 8000
